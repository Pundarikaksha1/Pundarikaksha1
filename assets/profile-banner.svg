  <text x="54" y="191" fill="#cbd5e1" font-size="21" font-family="Arial, sans-serif" font-weight="600">Forward Deployed Engineer  ·  Full-Stack Developer</text>
  <text x="54" y="225" fill="#8be4f5" font-size="17" font-family="Arial, sans-serif" font-weight="600" letter-spacing="1.3">PYTHON   /   AI   /   ML   /   GENAI</text>
