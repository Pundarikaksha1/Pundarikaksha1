<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Pundari Kaksha — Forward Deployed Engineer</title>
  <desc id="desc">Premium dark blue developer profile banner with a subtle grid, glowing shapes and an AI, ML and GenAI headline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".55" stop-color="#10234a"/>
      <stop offset="1" stop-color="#182050"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbeafe" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#477dff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#477dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#background)"/>
  <rect width="1200" height="260" rx="20" fill="url(#grid)"/>
  <circle cx="1030" cy="92" r="260" fill="url(#glow)"/>
  <path d="M0 246C260 196 472 282 735 226S1074 199 1200 165" fill="none" stroke="#67e8f9" stroke-opacity=".17" stroke-width="2"/>
  <path d="M870 30L1138 30L1138 222L870 222Z" fill="none" stroke="#94a3b8" stroke-opacity=".12"/>
  <path d="M908 65L1058 65L1126 126L1058 190L908 190L838 126Z" fill="none" stroke="url(#accent)" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="982" cy="126" r="38" fill="none" stroke="#67e8f9" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="982" cy="126" r="8" fill="#67e8f9"/>
  <circle cx="908" cy="65" r="5" fill="#a78bfa"/>
  <circle cx="1126" cy="126" r="5" fill="#67e8f9"/>
  <circle cx="1058" cy="190" r="5" fill="#a78bfa"/>
  <rect x="54" y="42" width="194" height="28" rx="14" fill="#163461" stroke="#4694db" stroke-opacity=".6"/>
